<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кондитерская - Заказ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 30px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .user-info {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .user-info p {
            margin: 5px 0;
        }

        .menu-item {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .menu-item:active {
            transform: scale(0.98);
        }

        .menu-item span {
            font-size: 24px;
        }

        .status {
            text-align: center;
            padding: 20px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            margin-top: 20px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Кондитерская</h1>
        <p class="welcome">Добро пожаловать!</p>

        <div class="user-info" id="userInfo">
            <p><strong>Загрузка данных...</strong></p>
        </div>

        <h2 style="margin-bottom: 15px;">Что хотите заказать?</h2>

        <div class="menu-item" onclick="selectItem('cake')">
            <div>
                <strong>Торт</strong>
                <p style="font-size: 14px; color: var(--tg-theme-hint-color, #999);">На заказ по вашему дизайну</p>
            </div>
            <span>🎂</span>
        </div>

        <div class="menu-item" onclick="selectItem('cupcakes')">
            <div>
                <strong>Капкейки</strong>
                <p style="font-size: 14px; color: var(--tg-theme-hint-color, #999);">Набор от 6 штук</p>
            </div>
            <span>🧁</span>
        </div>

        <div class="menu-item" onclick="selectItem('desserts')">
            <div>
                <strong>Десерты</strong>
                <p style="font-size: 14px; color: var(--tg-theme-hint-color, #999);">Пирожные, эклеры, муссы</p>
            </div>
            <span>🍰</span>
        </div>

        <div class="status" id="status" style="display: none;"></div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;

        // Сообщаем Telegram что приложение готово
        tg.ready();

        // Расширяем на весь экран
        tg.expand();

        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;

        // Отображаем информацию о пользователе
        const userInfoDiv = document.getElementById('userInfo');
        if (user) {
            userInfoDiv.innerHTML = `
                <p><strong>Привет, ${user.first_name}!</strong></p>
                <p>ID: ${user.id}</p>
                ${user.username ? `<p>Username: @${user.username}</p>` : ''}
            `;
        } else {
            userInfoDiv.innerHTML = `
                <p><strong>Тестовый режим</strong></p>
                <p>Откройте через Telegram для полного функционала</p>
            `;
        }

        // Обработка выбора товара
        function selectItem(item) {
            const names = {
                'cake': 'Торт',
                'cupcakes': 'Капкейки',
                'desserts': 'Десерты'
            };

            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.className = 'status success';
            statusDiv.innerHTML = `Вы выбрали: <strong>${names[item]}</strong><br><br>Скоро здесь будет форма заказа!`;

            // Можно отправить данные боту
            // tg.sendData(JSON.stringify({action: 'select', item: item}));
        }

        // Настраиваем главную кнопку (пока скрыта)
        tg.MainButton.text = "Оформить заказ";
        // tg.MainButton.show();
    </script>
</body>
</html>
