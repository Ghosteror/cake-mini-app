<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Торт - tiramiss'u</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --candy: #D54D31;
            --sugar: #FFF7F5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--sugar);
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px;
            text-align: center;
            background: var(--sugar);
            z-index: 100;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--candy);
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            touch-action: none;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .control-btn {
            padding: 12px 20px;
            border: 2px solid var(--candy);
            background: white;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            color: var(--candy);
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn.active {
            background: var(--candy);
            color: white;
        }

        .hint {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #888;
            text-align: center;
        }

        .color-picker {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .color-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }

        .color-dot.active {
            border-color: var(--candy);
            transform: scale(1.15);
        }

        .color-dot:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-text">tiramiss'u</div>
    </div>

    <div class="color-picker">
        <div class="color-dot active" style="background: #FFB6C1;" data-color="0xFFB6C1" title="Розовый"></div>
        <div class="color-dot" style="background: #E6D5AC;" data-color="0xE6D5AC" title="Ваниль"></div>
        <div class="color-dot" style="background: #8B4513;" data-color="0x8B4513" title="Шоколад"></div>
        <div class="color-dot" style="background: #98D8AA;" data-color="0x98D8AA" title="Фисташка"></div>
        <div class="color-dot" style="background: #F4A460;" data-color="0xF4A460" title="Карамель"></div>
    </div>

    <div id="canvas-container"></div>

    <div class="hint">Крутите торт пальцем</div>

    <div class="controls">
        <button class="control-btn active" data-layers="1">1 ярус</button>
        <button class="control-btn" data-layers="2">2 яруса</button>
        <button class="control-btn" data-layers="3">3 яруса</button>
    </div>

    <script>
        // Сцена, камера, рендерер
        let scene, camera, renderer;
        let cake = null;
        let currentColor = 0xFFB6C1;
        let currentLayers = 1;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        function init() {
            const container = document.getElementById('canvas-container');

            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xFFF7F5);

            // Камера
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 8);
            camera.lookAt(0, 1, 0);

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
            backLight.position.set(-5, 5, -5);
            scene.add(backLight);

            // Подставка
            const plateGeometry = new THREE.CylinderGeometry(2.5, 2.5, 0.1, 32);
            const plateMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                metalness: 0.1,
                roughness: 0.3
            });
            const plate = new THREE.Mesh(plateGeometry, plateMaterial);
            plate.position.y = 0;
            plate.receiveShadow = true;
            scene.add(plate);

            // Создаём торт
            createCake(currentLayers);

            // События мыши/тача
            renderer.domElement.addEventListener('mousedown', onPointerDown);
            renderer.domElement.addEventListener('mousemove', onPointerMove);
            renderer.domElement.addEventListener('mouseup', onPointerUp);
            renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
            renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
            renderer.domElement.addEventListener('touchend', onPointerUp);

            // Ресайз
            window.addEventListener('resize', onWindowResize);

            // Кнопки ярусов
            document.querySelectorAll('.control-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentLayers = parseInt(btn.dataset.layers);
                    createCake(currentLayers);
                });
            });

            // Выбор цвета
            document.querySelectorAll('.color-dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                    dot.classList.add('active');
                    currentColor = parseInt(dot.dataset.color);
                    updateCakeColor();
                });
            });

            animate();
        }

        function createCake(layers) {
            // Удаляем старый торт
            if (cake) {
                scene.remove(cake);
            }

            cake = new THREE.Group();

            const creamMaterial = new THREE.MeshStandardMaterial({
                color: currentColor,
                roughness: 0.4,
                metalness: 0.1
            });

            const spongeMaterial = new THREE.MeshStandardMaterial({
                color: 0xF5DEB3,
                roughness: 0.8,
                metalness: 0
            });

            let yOffset = 0.1;
            const layerConfigs = [
                { radius: 2, height: 1.2 },
                { radius: 1.5, height: 1.0 },
                { radius: 1.0, height: 0.8 }
            ];

            for (let i = 0; i < layers; i++) {
                const config = layerConfigs[i];
                const layerGroup = new THREE.Group();

                // Основа (бисквит)
                const spongeGeometry = new THREE.CylinderGeometry(
                    config.radius, config.radius, config.height * 0.9, 32
                );
                const sponge = new THREE.Mesh(spongeGeometry, spongeMaterial);
                sponge.castShadow = true;
                layerGroup.add(sponge);

                // Крем сверху
                const creamGeometry = new THREE.CylinderGeometry(
                    config.radius + 0.05, config.radius + 0.05, config.height * 0.15, 32
                );
                const cream = new THREE.Mesh(creamGeometry, creamMaterial.clone());
                cream.position.y = config.height * 0.5;
                cream.castShadow = true;
                layerGroup.add(cream);

                // Декоративные шарики крема по краю
                const ballCount = Math.floor(config.radius * 8);
                for (let j = 0; j < ballCount; j++) {
                    const angle = (j / ballCount) * Math.PI * 2;
                    const ballGeometry = new THREE.SphereGeometry(0.12, 16, 16);
                    const ball = new THREE.Mesh(ballGeometry, creamMaterial.clone());
                    ball.position.x = Math.cos(angle) * (config.radius - 0.1);
                    ball.position.z = Math.sin(angle) * (config.radius - 0.1);
                    ball.position.y = config.height * 0.55;
                    ball.castShadow = true;
                    layerGroup.add(ball);
                }

                layerGroup.position.y = yOffset + config.height / 2;
                yOffset += config.height;
                cake.add(layerGroup);
            }

            // Вишенка на верхушке
            const cherryGeometry = new THREE.SphereGeometry(0.2, 16, 16);
            const cherryMaterial = new THREE.MeshStandardMaterial({
                color: 0xDC143C,
                roughness: 0.3,
                metalness: 0.2
            });
            const cherry = new THREE.Mesh(cherryGeometry, cherryMaterial);
            cherry.position.y = yOffset + 0.2;
            cherry.castShadow = true;
            cake.add(cherry);

            // Веточка вишни
            const stemGeometry = new THREE.CylinderGeometry(0.02, 0.02, 0.3, 8);
            const stemMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const stem = new THREE.Mesh(stemGeometry, stemMaterial);
            stem.position.y = yOffset + 0.4;
            stem.rotation.z = 0.3;
            cake.add(stem);

            scene.add(cake);
        }

        function updateCakeColor() {
            if (!cake) return;

            cake.traverse((child) => {
                if (child.isMesh && child.material.color) {
                    const color = child.material.color.getHex();
                    // Обновляем только кремовые части (не бисквит, не вишню)
                    if (color !== 0xF5DEB3 && color !== 0xDC143C && color !== 0x228B22) {
                        child.material.color.setHex(currentColor);
                    }
                }
            });
        }

        function onPointerDown(e) {
            isDragging = true;
            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
        }

        function onTouchStart(e) {
            e.preventDefault();
            isDragging = true;
            previousMousePosition = {
                x: e.touches[0].clientX,
                y: e.touches[0].clientY
            };
        }

        function onPointerMove(e) {
            if (!isDragging || !cake) return;

            const deltaX = e.clientX - previousMousePosition.x;
            cake.rotation.y += deltaX * 0.01;

            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
        }

        function onTouchMove(e) {
            e.preventDefault();
            if (!isDragging || !cake) return;

            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            cake.rotation.y += deltaX * 0.01;

            previousMousePosition = {
                x: e.touches[0].clientX,
                y: e.touches[0].clientY
            };
        }

        function onPointerUp() {
            isDragging = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Лёгкое авто-вращение когда не трогают
            if (!isDragging && cake) {
                cake.rotation.y += 0.003;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
